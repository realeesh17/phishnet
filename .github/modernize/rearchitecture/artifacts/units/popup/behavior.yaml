    trigger: "API unavailable or validation failure"
    outcome: "show error without replacing a successful prior result"
    contract: "user-visible error message"
    must_preserve: true
concurrency:
  model: event-loop
  tx_boundary:
    source_loc: extension/src/App.tsx:95
    scope: "one active scan request at a time"
    isolation: "none"
    must_preserve: true
