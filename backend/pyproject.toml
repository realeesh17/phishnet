[project]
name = "phishnet-api"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
    "azure-functions>=1.17,<2.0",
    "fastapi>=0.115,<1.0",
    "structlog>=24.1,<26.0",
    "limits[redis]>=4.0,<6.0",
    "dnspython>=2.6,<3.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<9.0",
    "ruff>=0.6,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
